<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 80 1600 690" role="img" aria-labelledby="hstitle hsdesc">
<title id="hstitle">The Hyperspace Engine — five nodes, four gates, one way through</title>
<desc id="hsdesc">A single left-to-right spine: an idea enters the acing-hyperspace primer, which routes to gear2-understand (N1), gear3-decide (N2), gear4-draft (N3) and gear5-build (N4), each exiting through a gate. The Build gate carries an extra HOLD path for undischarged manual criteria. Passing the Build gate sets status to live and enters gear6-live, a dashed no-gate stage where a human confirms before the run reaches done and ships. Above the loop, Nova Task Graph, the Verifier MCP and Caelos connect into the Draft and Build stages. Below, a state-layer rail (loop.state.json) touches every gate and carries the tests evidence and a double-back glyph for re-hash mismatches, and a small two-track diagram shows current_node halting at executing while status continues from live to done.</desc>
